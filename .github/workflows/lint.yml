name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint

      - name: Check blog generation and examples
        run: npm run blog:check && npm test

      - name: Install browser for blog checks
        run: npx playwright install --with-deps chromium

      - name: Check desktop and mobile articles
        run: npm run test:blog -- --project=Chromium --project=Android
